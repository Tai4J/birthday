<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生日快樂賀卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fff8ee; --ink:#4a2f27; --coral:#ff7a6b; --rose:#ffb3a7;
    --mustard:#ffc94d; --mint:#8fd6c2; --sky:#9cc9ff; --plum:#b48ad9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse at 20% 10%,#ffe3d6 0%,transparent 55%),
               radial-gradient(ellipse at 85% 90%,#ffeab3 0%,transparent 50%),
               linear-gradient(160deg,#fff1e6,#ffe0e0 60%,#f6e3ff);
    overflow:hidden;min-height:100vh;
  }
  .hand{font-family:"LXGW WenKai TC","Noto Sans TC",serif}

  /* ---------- balloons ---------- */
  #balloons{position:fixed;inset:0;pointer-events:none;z-index:1}
  .balloon{position:absolute;bottom:-160px;width:64px;height:80px;border-radius:50% 50% 48% 48%;
    pointer-events:auto;cursor:pointer;animation:rise linear forwards;
    box-shadow:inset -8px -10px 0 rgba(0,0,0,.08)}
  .balloon::before{content:"";position:absolute;top:14px;left:14px;width:12px;height:18px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(25deg)}
  .balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70px;background:rgba(74,47,39,.35)}
  .balloon .knot{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:0;height:0;
    border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid currentColor}
  @keyframes rise{from{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-60vh) rotate(4deg)}to{transform:translateY(-130vh) rotate(-3deg)}}
  .pop-text{position:fixed;z-index:30;font-family:"LXGW WenKai TC",serif;font-size:20px;font-weight:700;
    color:var(--coral);pointer-events:none;animation:popText 1.4s ease-out forwards;white-space:nowrap;
    text-shadow:0 2px 0 #fff}
  @keyframes popText{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

  /* ---------- stage ---------- */
  .stage{position:relative;z-index:5;min-height:100vh;display:grid;place-items:center;padding:24px;pointer-events:none}
  .envelope-wrap{pointer-events:auto}

  /* ---------- envelope ---------- */
  .envelope-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;transition:opacity .6s,transform .6s}
  .envelope-wrap.gone{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none}
  .envelope{position:relative;width:min(340px,82vw);aspect-ratio:3/2;cursor:pointer;perspective:900px;
    filter:drop-shadow(0 18px 30px rgba(120,60,40,.25));transition:transform .25s}
  .envelope:hover{transform:translateY(-4px) rotate(-1deg)}
  .env-back{position:absolute;inset:0;background:#f4a493;border-radius:10px}
  .env-front{position:absolute;inset:0;border-radius:10px;overflow:hidden}
  .env-front::before,.env-front::after{content:"";position:absolute;inset:0}
  .env-front::before{background:#ff9b87;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
  .env-front::after{background:#ff8270;clip-path:polygon(0 100%,50% 48%,100% 100%)}
  .env-flap{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:top;transition:transform .7s cubic-bezier(.6,.1,.3,1);z-index:3}
  .env-flap::before{content:"";position:absolute;inset:0;background:#ffb3a1;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
  .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;width:62px;height:62px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff6f61,#d94a3d);display:grid;place-items:center;color:#fff3e8;
    font-family:"LXGW WenKai TC",serif;font-size:14px;font-weight:700;box-shadow:0 3px 0 #b23a2f;transition:opacity .3s}
  .envelope.open .seal{opacity:0}
  .env-to{position:absolute;bottom:14%;left:0;right:0;text-align:center;z-index:2;font-size:15px;color:#fff;font-family:"LXGW WenKai TC",serif;letter-spacing:.1em}
  .tap-hint{font-size:15px;color:#9a6a5c;letter-spacing:.15em;animation:breathe 2s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.4}}

  /* ---------- card ---------- */
  .card{position:absolute;width:min(560px,94vw);max-height:94vh;overflow:auto;background:var(--paper);border-radius:22px;
    padding:34px 30px 26px;box-shadow:0 30px 60px rgba(120,60,40,.22),0 0 0 8px #fff inset;
    opacity:0;transform:translateY(60px) scale(.92);pointer-events:none;transition:opacity .7s .2s,transform .8s .2s cubic-bezier(.2,.9,.3,1.2);
    background-image:radial-gradient(#f3dfc9 1px,transparent 1px);background-size:18px 18px;scrollbar-width:none}
  .card::-webkit-scrollbar{display:none}
  .card.show{opacity:1;transform:none;pointer-events:auto}
  .bunting{position:absolute;top:0;left:20px;right:20px;height:30px;display:flex;justify-content:space-between}
  .bunting span{width:26px;height:28px;clip-path:polygon(0 0,100% 0,50% 100%);animation:sway 3s ease-in-out infinite;transform-origin:top}
  .bunting span:nth-child(odd){animation-delay:-1.5s}
  @keyframes sway{50%{transform:rotate(6deg)}}

  h1{font-family:"LXGW WenKai TC",serif;text-align:center;font-size:clamp(38px,9vw,56px);font-weight:700;margin-top:10px;line-height:1.1;
    background:linear-gradient(90deg,var(--coral),#ff9f45,var(--plum));-webkit-background-clip:text;background-clip:text;color:transparent}
  .to{text-align:center;font-family:"LXGW WenKai TC",serif;font-size:22px;margin-top:8px}
  .to .name{color:var(--coral);font-weight:700;border-bottom:2px dashed var(--rose);padding:0 4px}

  /* cake */
  .cake-area{position:relative;height:230px;margin:18px auto 6px;width:270px;touch-action:none}
  .plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:270px;height:18px;border-radius:50%;background:#e8d6c4}
  .tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
  .tier.bottom{bottom:10px;width:230px;height:70px;background:linear-gradient(#ffd0c4,#ffb8a8)}
  .tier.top{bottom:76px;width:186px;height:56px;background:linear-gradient(#fff1d6,#ffe1a8)}
  .drip{position:absolute;top:0;left:0;right:0;height:22px;border-radius:14px 14px 0 0;
    background:radial-gradient(circle at 10px 18px,var(--c) 9px,transparent 10px) 0 0/24px 26px repeat-x,linear-gradient(var(--c),var(--c)) 0 0/100% 12px no-repeat}
  .tier.bottom .drip{--c:#fff}
  .tier.top .drip{--c:#ff8fa3}
  .sprinkles{position:absolute;inset:26px 14px 10px}
  .sprinkles i{position:absolute;width:10px;height:4px;border-radius:2px}
  .candles{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);width:176px;height:60px}
  .candle-row{position:absolute;left:0;right:0;height:34px;pointer-events:none}
  .candle-row .candle{pointer-events:auto}
  .card:not(.show) .candle{pointer-events:none}
  .candle-row.back{bottom:14px}
  .candle-row.front{bottom:0;z-index:2}
  .candle{position:absolute;bottom:0;width:8px;height:34px;border-radius:2px;cursor:pointer;
    background:repeating-linear-gradient(135deg,#fff 0 4px,var(--cc) 4px 8px)}
  .candle-row.back .candle{height:30px;filter:brightness(.95)}
  .candle::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:6px;background:#5a4036;transform:translateX(-50%)}
  .flame{pointer-events:none;position:absolute;left:50%;top:-22px;width:10px;height:16px;transform:translateX(-50%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(ellipse at 50% 70%,#fff7c2 0 25%,#ffc94d 45%,#ff8a3d 80%);
    box-shadow:0 0 12px 4px rgba(255,190,80,.5);animation:flick .18s ease-in-out infinite alternate;transform-origin:bottom center}
  @keyframes flick{to{transform:translateX(-50%) scale(.92,1.06) rotate(2deg)}}
  .candle.out .flame{animation:none;opacity:0;transform:translateX(-50%) scale(.2);transition:all .3s}
  .smoke{position:absolute;left:50%;top:-14px;width:6px;height:6px;border-radius:50%;background:rgba(150,150,150,.5);opacity:0;pointer-events:none}
  .candle.out .smoke{animation:smoke 1.6s ease-out forwards}
  @keyframes smoke{0%{opacity:.7;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-30%,-60px) scale(4)}}

  .hint{text-align:center;font-size:14px;color:#a07868;min-height:22px;letter-spacing:.05em}

  /* message */
  .message{font-family:"LXGW WenKai TC",serif;font-size:18px;line-height:1.9;margin:14px 4px 6px;padding:16px 18px;border-radius:14px;
    background:#fff;border:1.5px solid #f3d9c7;max-height:0;opacity:0;overflow:hidden;transition:max-height .9s ease,opacity .8s ease,padding .5s;padding-top:0;padding-bottom:0}
  .message.show{max-height:1400px;opacity:1;padding:16px 18px}
  .msg{white-space:pre-wrap}
  .sign{text-align:right;margin-top:8px;font-family:"LXGW WenKai TC",serif;font-size:17px}

  .photo-slot{display:none;margin:14px auto 0;width:150px;height:150px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 6px 16px rgba(120,60,40,.2);transform:rotate(-3deg)}
  .photo-slot.has{display:block}
  .photo-slot img{width:100%;height:100%;object-fit:cover}

  .wish{text-align:center;font-family:"LXGW WenKai TC",serif;font-size:28px;font-weight:700;color:var(--coral);margin-top:14px}
  .wish small{display:block;font-size:15px;font-weight:400;color:#a07868;margin-top:6px}
  .counter{text-align:center;font-size:15px;color:var(--ink);margin-top:2px}
  .counter b{color:var(--coral);font-size:20px}
  .card:not(.locked) .wish,.card:not(.locked) .counter{display:none}
  .wish-form{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px}
  .wish-form textarea{width:100%;max-width:380px;font:inherit;font-family:"LXGW WenKai TC","Noto Sans TC",serif;font-size:17px;line-height:1.6;
    padding:12px 14px;border-radius:14px;border:1.5px solid #f3d9c7;background:#fff;color:var(--ink);resize:none;outline:none}
  .wish-form textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,122,107,.15)}
  .wish-note{font-family:"LXGW WenKai TC","Noto Sans TC",serif;font-size:15px;color:#a07868}
  .wish-err{font-size:13px;color:#d94a3d;min-height:18px}
  .wish-form textarea.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .card:not(.wishing) .wish-form{display:none}
  .card.wishing .counter,.card.wishing .hint{display:none}
  .card.wishing .candles{pointer-events:none}
  .reveal{transition:opacity .9s ease,transform .9s ease}
  .card.locked .reveal{display:none}
  .card.unlocking .reveal{opacity:0;transform:translateY(16px)}
  .reveal-card{transition:opacity .9s ease,transform .9s ease}
  .card.sealed .reveal-card{display:none}
  .card.opening .reveal-card{opacity:0;transform:translateY(16px)}
  .card:not(.sealed) #openBtn{display:none}
  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  button,.btn{font:inherit;font-size:14px;border:none;border-radius:999px;padding:9px 16px;cursor:pointer;background:#fff;color:var(--ink);
    box-shadow:0 2px 0 #ecd2c0,0 0 0 1.5px #f1d8c6 inset;transition:transform .15s,background .2s}
  button:hover,.btn:hover{transform:translateY(-2px);background:#fff3ea}
  button.primary{background:var(--coral);color:#fff;box-shadow:0 3px 0 #d75b4d}
  button.primary:hover{background:#ff8a7c}
  .btn input{display:none}

  [contenteditable="true"]{outline:2px dashed var(--mustard);outline-offset:3px;border-radius:6px;background:#fffbe9}
  .editing-note{display:none;text-align:center;font-size:13px;color:#b07f2c;margin-top:10px}
  body.editing .editing-note{display:block}

  @media (max-width:480px){
    .card{padding:30px 16px 22px}
    .message{margin:14px 0 6px;font-size:min(18px,4vw)}
    .message.show{padding:14px 14px}
    .hint{font-size:min(14px,3.5vw)}
  }
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div id="balloons"></div>
<canvas id="confetti"></canvas>

<main class="stage">
  <div class="envelope-wrap" id="envWrap">
    <div class="envelope" id="envelope" role="button" aria-label="打開信封">
      <div class="env-back"></div>
      <div class="env-flap"></div>
      <div class="env-front"></div>
      <div class="seal">生日<br>快樂</div>
      <div class="env-to">To：<span class="js-name">孫詩芸</span></div>
    </div>
    <div class="tap-hint">點一下信封打開</div>
  </div>

  <section class="card locked sealed" id="card" aria-live="polite">
    <div class="bunting" id="bunting"></div>
    <p class="wish">許個願，吹蠟燭囉</p>
    <h1 class="reveal-card">生日快樂！</h1>
    <p class="to reveal-card">To：<span class="name js-name editable" data-key="name">孫詩芸</span></p>


    <div class="cake-area">
      <div class="plate"></div>
      <div class="tier bottom"><div class="drip"></div><div class="sprinkles" id="spr1"></div></div>
      <div class="tier top"><div class="drip"></div><div class="sprinkles" id="spr2"></div></div>
      <div class="candles" id="candles"></div>
    </div>
    <p class="counter" id="counter">還有 <b id="left">22</b> 根</p>
    <p class="hint" id="hint">點蠟燭，或用手指／滑鼠劃過去一次吹熄好幾根</p>

    <div class="message reveal-card" id="message">
      <div class="msg editable" data-key="msg">祝妳生日快樂！
現在回想起來
我們認識的過程其實也蠻有趣的
我到現在都不知道該怎麼跟別人講起哈哈

大四的妳應該會很忙吧
記得要適當休息
別把自己身體搞壞了
希望妳推甄順利！

願妳新的一歲平安健康、天天開心
想做的事都能一件一件實現！</div>
      <div class="sign editable" data-key="sign">—— 戴士傑（資管</div>
    </div>

    <div class="controls reveal">
      <button class="primary" id="openBtn">打開卡片</button>
      <button id="songBtn">播生日歌</button>
      <button id="confettiBtn">撒彩帶</button>
      <button id="relightBtn">重新點蠟燭</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const COLORS = ['#ff7a6b','#ffc94d','#8fd6c2','#9cc9ff','#b48ad9','#ffb3a7'];
  const store = {
    get(k){ try{ return localStorage.getItem('bdcard2_'+k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem('bdcard2_'+k,v); }catch(e){} }
  };

  const syncName = () => {
    const n = document.querySelector('.name.editable').textContent.trim() || '你';
    document.querySelectorAll('.js-name').forEach(e=>{ if(!e.classList.contains('editable')) e.textContent = n; });
  };
  syncName();

  /* bunting */
  const bunting = $('#bunting');
  for(let i=0;i<12;i++){ const s=document.createElement('span'); s.style.background=COLORS[i%COLORS.length]; bunting.appendChild(s); }

  /* sprinkles */
  [['#spr1',14],['#spr2',9]].forEach(([id,n])=>{
    const box=$(id);
    for(let i=0;i<n;i++){ const s=document.createElement('i');
      s.style.left=Math.random()*92+'%'; s.style.top=Math.random()*80+'%';
      s.style.background=COLORS[i%COLORS.length]; s.style.transform=`rotate(${Math.random()*180}deg)`; box.appendChild(s); }
  });

  /* candles */
  const candlesBox=$('#candles'); const N=22;
  function makeCandles(){
    candlesBox.innerHTML='<div class="candle-row back"></div><div class="candle-row front"></div>';
    const rows=candlesBox.querySelectorAll('.candle-row');
    for(let i=0;i<N;i++){
      const c=document.createElement('div'); c.className='candle'; c.style.setProperty('--cc',COLORS[i%COLORS.length]);
      c.innerHTML='<div class="flame"></div><div class="smoke"></div>'; c.setAttribute('role','button'); c.setAttribute('aria-label','吹熄蠟燭');
      c.addEventListener('click',()=>blow(c)); c.style.left=(Math.floor(i/2)*16+(i%2?8:0))+'px'; rows[1-i%2].appendChild(c);
    }
  }
  makeCandles();
  let celebrated=false;
  function blow(c){
    if(c.classList.contains('out')) return;
    c.classList.add('out');
    const left=candlesBox.querySelectorAll('.candle:not(.out)').length;
    const hint=$('#hint'); $('#left').textContent=left;
    if(left>0){ if(left<=3) hint.textContent='最後 '+left+' 根，加油！'; }
    else if(!celebrated){ celebrated=true; hint.textContent='生日快樂！'; celebrate(); }
  }
  // drag across candles to blow several at once
  let dragging=false;
  const area=document.querySelector('.cake-area');
  const sweep=e=>{
    if(!dragging) return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const c=el && el.closest && el.closest('.candle'); if(c) blow(c);
  };
  area.addEventListener('pointerdown',e=>{ dragging=true; sweep(e); });
  area.addEventListener('pointermove',sweep);
  addEventListener('pointerup',()=>dragging=false);
  addEventListener('pointercancel',()=>dragging=false);
  $('#relightBtn').onclick=()=>{ celebrated=false; makeCandles(); $('#hint').textContent='蠟燭點好了，再許一次願吧'; };

  function celebrate(){
    burst(220); setTimeout(()=>burst(140),500);
    const card=$('#card');
    if(card.classList.contains('locked')){
      card.classList.add('unlocking'); card.classList.remove('locked');
      requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('unlocking')));
    }
    for(let i=0;i<6;i++) setTimeout(spawnBalloon,i*250);
  }

  function openCard(){
    const card=$('#card'); if(!card.classList.contains('sealed')) return;
    card.classList.add('opening'); card.classList.remove('sealed');
    requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('opening')));
    card.scrollTo({top:0,behavior:'smooth'});
    setTimeout(()=>$('#message').classList.add('show'),300);
    burst(120);
  }
  $('#openBtn').onclick=openCard;

  /* envelope */
  $('#envelope').addEventListener('click',()=>{
    const env=$('#envelope'); if(env.classList.contains('open')) return;
    env.classList.add('open');
    setTimeout(()=>{ $('#envWrap').classList.add('gone'); $('#card').classList.add('show'); burst(90); },700);
  });

  /* balloons */
  const BMSG=['生日快樂！','賺大錢！','天天開心！','壽星最大！','推甄順利！'];
  function spawnBalloon(){
    const b=document.createElement('div'); b.className='balloon';
    const col=COLORS[Math.floor(Math.random()*COLORS.length)];
    b.style.background=col; b.style.color=col;
    b.style.left=(4+Math.random()*88)+'vw';
    const dur=11+Math.random()*8; b.style.animationDuration=dur+'s';
    const sc=.75+Math.random()*.5; b.style.width=64*sc+'px'; b.style.height=80*sc+'px';
    b.innerHTML='<span class="knot"></span>';
    b.addEventListener('click',e=>{
      e.stopPropagation(); popAt(e.clientX,e.clientY,col); b.remove();
    });
    $('#balloons').appendChild(b);
    setTimeout(()=>b.remove(),dur*1000+200);
  }
  function popAt(x,y,col){
    burst(40,x,y,[col,'#fff',col]);
    const t=document.createElement('div'); t.className='pop-text';
    t.textContent=BMSG[Math.floor(Math.random()*BMSG.length)];
    t.style.left=x+'px'; t.style.top=y+'px'; document.body.appendChild(t);
    setTimeout(()=>t.remove(),1500);
  }
  for(let i=0;i<4;i++) setTimeout(spawnBalloon,i*900);
  setInterval(()=>{ if(document.querySelectorAll('.balloon').length<7) spawnBalloon(); },2200);

  /* confetti */
  const cv=$('#confetti'), ctx=cv.getContext('2d'); let parts=[];
  const resize=()=>{ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); };
  resize(); addEventListener('resize',resize);
  function burst(n,x=innerWidth/2,y=innerHeight*0.42,cols=COLORS){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=4+Math.random()*9;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:6+Math.random()*6,h:8+Math.random()*8,
        r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],life:0,max:120+Math.random()*80,circle:Math.random()<.3});
    }
    if(!raf) raf=requestAnimationFrame(loop);
  }
  let raf=null;
  function loop(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life<p.max && p.y<innerHeight+40);
    for(const p of parts){
      p.life++; p.vy+=.18; p.vx*=.99; p.vy*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      if(p.circle){ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); }
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*.1)));
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : null;
  }
  $('#confettiBtn').onclick=()=>{ burst(160); burst(80,80,innerHeight); burst(80,innerWidth-80,innerHeight); };

  /* sound */
  let ac=null;
  function audio(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ ac=null; } return ac; }
  function tone(f,d,type='sine',vol=.15,t0=0){
    const a=audio(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain(); const t=a.currentTime+t0;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05);
  }
  // Happy Birthday (public-domain melody)
  const N_={G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784};
  const SONG=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
              ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
              ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
              ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
  let playing=false;
  function playSong(){
    if(playing) return; playing=true; const beat=.42; let t=.05;
    for(const [n,d] of SONG){ tone(N_[n],d*beat*1.1,'triangle',.16,t); tone(N_[n]*2,d*beat*.6,'sine',.03,t); t+=d*beat; }
    $('#songBtn').textContent='播放中…';
    setTimeout(()=>{ playing=false; $('#songBtn').textContent='播生日歌'; },t*1000+200);
  }
  $('#songBtn').onclick=playSong;
})();
</script>
